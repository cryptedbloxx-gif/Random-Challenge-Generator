<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Random Challenge Generator</title>

<link rel="icon"
href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#6a11cb,#2575fc);
    color:white;
    text-align:center;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* PARTICLES */
.particle{
    position:fixed;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:0.4;
    animation:float linear infinite;
    pointer-events:none;
}

@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-10vh);}
}

.container{
    max-width:800px;
    padding:30px;
    z-index:2;
}

h1{
    font-size:3rem;
}

#challenge{
    font-size:1.8rem;
    min-height:100px;
    margin:30px 0;
}

button{
    padding:15px 35px;
    font-size:1.3rem;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    transition:0.25s ease;
}

button:hover{
    transform:scale(1.08);
}

/* RARITY COLORS */
.common{ color:white; }
.rare{ color:#4cc9f0; }
.epic{ color:#b517ff; }
.legendary{ color:#ffd60a; }

#difficulty{
    margin-top:20px;
    font-size:1.2rem;
    font-weight:bold;
}

/* OWNER */
#owner{
    position:fixed;
    top:15px;
    right:20px;
    font-weight:bold;
}

/* MUSIC BUTTON */
#musicBtn{
    position:fixed;
    top:15px;
    left:20px;
    padding:8px 12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

/* SHAKE */
.shake{
    animation:shake 0.4s;
}

@keyframes shake{
    0%{transform:translate(0);}
    20%{transform:translate(-10px);}
    40%{transform:translate(10px);}
    60%{transform:translate(-10px);}
    80%{transform:translate(10px);}
    100%{transform:translate(0);}
}

</style>
</head>

<body>

<div id="owner">👑 OWNER : TEJPREET</div>
<button id="musicBtn" onclick="toggleMusic()">🎵 Music</button>

<div class="container">

<h1>
    <span id="dice">🎲</span>
    Random Challenge Generator
</h1>

<div id="challenge">Click the button to get a challenge!</div>

<button onclick="generateChallenge()">Generate Challenge</button>

<div id="difficulty"></div>

</div>

<audio id="vineBoom">
    <source src="vineboom.mp3" type="audio/mpeg">
</audio>

<audio id="bgm" loop>
    <source src="bgm.mp3" type="audio/mpeg">
</audio>

<script>

/* MUSIC */
const bgm = document.getElementById("bgm");
bgm.volume = 0.2;

function toggleMusic(){
    if(bgm.paused) bgm.play();
    else bgm.pause();
}

/* PARTICLES */
for(let i=0;i<40;i++){
    let p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random()*100 + "vw";
    p.style.animationDuration = (Math.random()*8+5)+"s";
    document.body.appendChild(p);
}

/* ACHIEVEMENTS */
let achievements = {
    first: false,
    ten: false,
    legendary: false
};

let count = 0;

/* CHALLENGES */
const challenges = [
    {text:"Do 10 jumping jacks.", type:"common"},
    {text:"Dance for 20 seconds.", type:"common"},
    {text:"Act like a chicken.", type:"common"},

    {text:"Do 50 squats.", type:"rare"},
    {text:"Hold plank for 2 minutes.", type:"rare"},

    {text:"Sing loudly in public.", type:"epic"},

    {text:"Go outside and shout 'I AM LEGEND'.", type:"legendary"}
];

function generateChallenge(){

    let c = challenges[Math.floor(Math.random()*challenges.length)];

    document.getElementById("challenge").innerText = c.text;

    let diff = document.getElementById("difficulty");

    diff.className = c.type;

    diff.innerText = c.type.toUpperCase() + " CHALLENGE";

    document.body.classList.remove("shake");

    if(c.type === "rare") document.body.style.background = "linear-gradient(135deg,#0033ff,#00c3ff)";
    else if(c.type === "epic") document.body.style.background = "linear-gradient(135deg,#6a00ff,#ff00d4)";
    else if(c.type === "legendary") document.body.style.background = "linear-gradient(135deg,#ffb700,#ff2a2a)";
    else document.body.style.background = "linear-gradient(135deg,#6a11cb,#2575fc)";

    if(c.type !== "common"){
        document.getElementById("vineBoom").play();
        document.body.classList.add("shake");
    }

    count++;

    if(count===1) achievements.first = true;
    if(count===10) achievements.ten = true;
    if(c.type==="legendary") achievements.legendary = true;
}

/* DICE */
const dice = document.getElementById("dice");
let hoverTimer;

const faces = ["🤪","💀","🤡","🗿","😳"];

dice.addEventListener("mouseenter",()=>{
    hoverTimer = setTimeout(()=>{
        dice.textContent = faces[Math.floor(Math.random()*faces.length)];
        dice.style.transform = "scale(1.5) rotate(360deg)";
    },10000);
});

dice.addEventListener("mouseleave",()=>{
    clearTimeout(hoverTimer);
    dice.textContent = "🎲";
    dice.style.transform = "scale(1) rotate(0deg)";
});

/* CLICK TO START AUDIO (browser fix) */
document.addEventListener("click",()=>{
    if(bgm.paused) bgm.play();
},{once:true});

</script>

</body>
</html>
