<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Challenge Generator</title>

<link rel="icon"
href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">

<style>

/* BASE */
body{
    margin:0;
    font-family:Arial;
    color:white;
    overflow:hidden;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    transition:1s ease;
}

/* PARTICLES */
.particle{
    position:fixed;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:0.4;
    animation:float linear infinite;
    pointer-events:none;
}

@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-10vh);}
}

/* LAYOUT */
.container{
    text-align:center;
    margin-top:15vh;
}

h1{font-size:3rem;}

button{
    padding:15px 30px;
    font-size:1.2rem;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{transform:scale(1.1);}

/* RARITY */
.common{color:white;}
.rare{color:#4cc9f0;}
.epic{color:#b517ff;}
.legendary{color:#ffd60a;}

/* OWNER */
#owner{
    position:fixed;
    top:10px;
    right:15px;
    font-weight:bold;
}

/* MUSIC */
#music{
    position:fixed;
    top:10px;
    left:15px;
    padding:8px;
}

/* ACHIEVEMENT POPUP */
#popup{
    position:fixed;
    top:-100px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.85);
    padding:12px 20px;
    border-radius:10px;
    display:flex;
    gap:10px;
    transition:0.5s;
}
#popup.show{top:20px;}

/* SHAKE */
.shake{animation:shake 0.4s;}
@keyframes shake{
    0%{transform:translate(0);}
    20%{transform:translate(-10px);}
    40%{transform:translate(10px);}
    60%{transform:translate(-10px);}
    80%{transform:translate(10px);}
    100%{transform:translate(0);}
}

</style>
</head>

<body>

<div id="owner">👑 OWNER : TEJPREET</div>
<button id="music" onclick="toggleMusic()">🎵</button>

<div class="container">

<h1><span id="dice">🎲</span> Challenge Generator</h1>

<div id="challenge">Click to start</div>
<button onclick="generate()">Generate</button>
<div id="diff"></div>

</div>

<!-- POPUP -->
<div id="popup">
    <div id="icon">🏆</div>
    <div id="text">Achievement</div>
</div>

<audio id="vine">
    <source src="vineboom.mp3">
</audio>

<audio id="bgm" loop>
    <source src="bgm.mp3">
</audio>

<script>

/* MUSIC */
const bgm=document.getElementById("bgm");
function toggleMusic(){
    bgm.paused ? bgm.play() : bgm.pause();
}

/* PARTICLES */
for(let i=0;i<50;i++){
    let p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=(Math.random()*10+5)+"s";
    document.body.appendChild(p);
}

/* ACHIEVEMENTS */
function popup(t,i){
    let p=document.getElementById("popup");
    document.getElementById("text").innerText=t;
    document.getElementById("icon").innerText=i;
    p.classList.add("show");
    setTimeout(()=>p.classList.remove("show"),2000);
}

/* DATA */
let count=0;

const challenges=[
{t:"Do 10 pushups",r:"common"},
{t:"Dance for 20 sec",r:"common"},
{t:"Act like chicken",r:"common"},

{t:"Do 50 squats",r:"rare"},
{t:"Hold plank 2 min",r:"rare"},

{t:"Sing in public",r:"epic"},

{t:"Scream I AM LEGEND",r:"legendary"}
];

/* GAME */
function generate(){

let c=challenges[Math.floor(Math.random()*challenges.length)];

document.getElementById("challenge").innerText=c.t;
document.getElementById("diff").innerText=c.r.toUpperCase();
document.getElementById("diff").className=c.r;

/* BACKGROUND */
if(c.r==="rare"){
document.body.style.background="linear-gradient(135deg,#0033ff,#00c3ff)";
}
else if(c.r==="epic"){
document.body.style.background="linear-gradient(135deg,#6a00ff,#ff00d4)";
}
else if(c.r==="legendary"){
document.body.style.background="linear-gradient(135deg,#ffb700,#ff2a2a)";
}
else{
document.body.style.background="linear-gradient(135deg,#6a11cb,#2575fc)";
}

/* EFFECTS */
if(c.r!=="common"){
document.getElementById("vine").play();
document.body.classList.add("shake");
setTimeout(()=>document.body.classList.remove("shake"),400);
}

/* ACHIEVEMENTS */
count++;
if(count===1)popup("First Challenge!","🎲");
if(count===10)popup("10 Challenges!","🔥");
if(c.r==="legendary")popup("LEGENDARY FOUND!","👑");

}

/* DICE EASTER EGG */
const dice=document.getElementById("dice");
let timer;

dice.addEventListener("mouseenter",()=>{
timer=setTimeout(()=>{
dice.innerText=["🤡","💀","🗿","😳"][Math.floor(Math.random()*4)];
dice.style.transform="scale(1.5) rotate(360deg)";
},10000);
});

dice.addEventListener("mouseleave",()=>{
clearTimeout(timer);
dice.innerText="🎲";
dice.style.transform="scale(1)";
});

/* MUSIC START */
document.addEventListener("click",()=>bgm.play(),{once:true});

</script>

</body>
</html>
