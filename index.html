<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lootbox Challenge Game</title>

<style>

/* BACKGROUND */
body{
    margin:0;
    font-family:Arial;
    overflow:hidden;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    color:white;
}

/* PARTICLES */
.particle{
    position:fixed;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:0.4;
    animation:float linear infinite;
}

@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-10vh);}
}

/* OWNER */
#owner{
    position:fixed;
    top:10px;
    right:15px;
    font-weight:bold;
}

/* MUSIC BUTTON */
#musicBtn{
    position:fixed;
    top:10px;
    left:15px;
    padding:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}
#musicBtn:hover{
    transform:scale(1.3);
}

/* LOOTBOX */
#lootbox{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:120px;
    cursor:pointer;
    transition:0.2s;
}
#lootbox:hover{
    transform:translate(-50%,-50%) scale(1.1);
}

/* BREAK ANIMATION */
.break{
    animation:break 0.6s forwards;
}
@keyframes break{
    0%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-50%,-50%) rotate(20deg) scale(1.3);}
    100%{transform:translate(-50%,-50%) rotate(-60deg) scale(0);}
}

/* CHALLENGE POPUP */
#challenge{
    position:fixed;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    font-size:25px;
    opacity:0;
    transition:0.5s;
}

/* SHAKE */
.shake{
    animation:shake 0.4s;
}
@keyframes shake{
    0%{transform:translate(0);}
    20%{transform:translate(-10px);}
    40%{transform:translate(10px);}
    60%{transform:translate(-10px);}
    80%{transform:translate(10px);}
    100%{transform:translate(0);}
}

</style>
</head>

<body>

<div id="owner">👑 OWNER : TEJPREET</div>

<button id="musicBtn" onclick="toggleMusic()">🔊</button>

<div id="lootbox">🎰</div>

<div id="challenge"></div>

<audio id="bgm" loop>
<source src="bgm.mp3">
</audio>

<audio id="vine">
<source src="vineboom.mp3">
</audio>

<audio id="thrash">
<source src="Thrash.mp3">
</audio>

<script>

/* MUSIC */
const bgm=document.getElementById("bgm");
let musicOn=true;

function toggleMusic(){
if(musicOn){bgm.pause();musicOn=false;}
else{bgm.play();musicOn=true;}
}

/* PARTICLES */
for(let i=0;i<50;i++){
let p=document.createElement("div");
p.className="particle";
p.style.left=Math.random()*100+"vw";
p.style.animationDuration=(Math.random()*8+5)+"s";
document.body.appendChild(p);
}

/* 100 CHALLENGES */
const challenges=[
"Do 10 pushups","Do 20 squats","Run in place 1 min","Dance randomly","Act like a chicken",
"Sing loudly","Spin 10 times","Jump 15 times","Do plank 30s","Do 5 burpees",
"Walk backwards","Talk in robot voice","Clap 50 times","Stare challenge 1 min","Sit and stand 20x",
"Touch your toes","Balance on one foot","Do 10 lunges","Make a funny face","Say alphabet backwards",
"Run around room","Do shadow boxing","Do 15 situps","Hop on one leg","Pretend you're a zombie",
"Do air guitar","Do 30 jumping jacks","Act like monkey","Whisper for 1 min","Freeze for 30s",
"Do 5 cartwheels","Dance without music","Act scared","Sing opera style","Do slow motion walk",
"Make meme face","Do 10 squats slow","Act like robot","Spin chair 5 times","Do wall sit 30s",
"Run outside","Clap above head","Do 10 pushups slow","Act like alien","Talk without lips",
"Do crab walk","Jump like frog","Act like superhero","Do 25 squats","Do 1 min plank",
"Do 10 burpees","Act like boss","Walk like ninja","Do silly dance","Make rap beat",
"Say tongue twister","Do shadow dance","Balance book head","Do pushups fast","Act like clown",
"Run zigzag","Do squat jumps","Act like ghost","Do air boxing","Do 50 jumps",
"Spin 20 times","Act like teacher","Do 10 frog jumps","Do situps fast","Act like king",
"Do plank walk","Do 30 squats","Act like robot broken","Jump backwards","Do funny scream",
"Act like DJ","Do fast dance","Do slow squat","Do 10 pushups clap","Act like villain",
"Do star jumps","Run in circle","Do wall pushups","Act like dragon","Do 100 jumps",
"Hold breath 10s","Do silent dance","Act like statue","Do ninja roll","Do 20 burpees",
"Do handstand try","Act like superhero landing","Do power pose","Do silly walk","Freeze dance"
];

let clickCount=0;

/* LOOTBOX */
const box=document.getElementById("lootbox");
const text=document.getElementById("challenge");

box.addEventListener("click",()=>{

clickCount++;

/* TRIPLE CLICK EVENT */
if(clickCount===3){
clickCount=0;

document.getElementById("thrash").play();
box.classList.add("shake","break");

setTimeout(()=>{
box.classList.remove("break");

let c=challenges[Math.floor(Math.random()*challenges.length)];

text.innerText=c;
text.style.opacity=1;
text.style.transform="scale(1.2)";

setTimeout(()=>{
text.style.transform="scale(1)";
},500);

},600);

}else{

box.style.transform="translate(-50%,-50%) scale(1.2)";
setTimeout(()=>{
box.style.transform="translate(-50%,-50%) scale(1)";
},200);

}

});

/* START MUSIC ON CLICK */
document.addEventListener("click",()=>{
bgm.play();
},{once:true});

</script>

</body>
</html>
