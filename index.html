<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Random Challenge Generator</title>

<link rel="icon"
href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#6a11cb,#2575fc);
    color:white;
    text-align:center;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* PARTICLES */
.particle{
    position:fixed;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:0.4;
    animation:float linear infinite;
    pointer-events:none;
}

@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-10vh);}
}

.container{
    max-width:800px;
    padding:30px;
}

/* OWNER */
#owner{
    position:fixed;
    top:10px;
    right:15px;
    font-weight:bold;
}

/* MUSIC */
#musicBtn{
    position:fixed;
    top:10px;
    left:15px;
}

/* CATEGORY BUTTONS */
#categories{
    margin-top:10px;
}

.cat{
    padding:5px 10px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

/* LOOTBOX */
#lootbox{
    position:fixed;
    bottom:20px;
    left:20px;
    padding:10px 15px;
    background:#111;
    border-radius:10px;
    cursor:pointer;
}

/* COMBO */
#combo{
    position:fixed;
    bottom:20px;
    right:20px;
    font-size:18px;
}

/* RARITY */
.common{color:white;}
.rare{color:#4cc9f0;}
.epic{color:#b517ff;}
.legendary{color:#ffd60a;}

/* SHAKE */
.shake{animation:shake 0.4s;}
@keyframes shake{
    0%{transform:translate(0);}
    20%{transform:translate(-10px);}
    40%{transform:translate(10px);}
    60%{transform:translate(-10px);}
    80%{transform:translate(10px);}
    100%{transform:translate(0);}
}

</style>
</head>

<body>

<div id="owner">👑 OWNER : TEJPREET</div>
<button id="musicBtn" onclick="toggleMusic()">🎵</button>

<div class="container">

<h1>🎲 Random Challenge Generator</h1>

<div id="challenge">Click to start</div>

<div id="difficulty"></div>

<div id="categories">
<button class="cat" onclick="setCat('all')">All</button>
<button class="cat" onclick="setCat('fun')">Fun</button>
<button class="cat" onclick="setCat('physical')">Physical</button>
<button class="cat" onclick="setCat('social')">Social</button>
</div>

<button onclick="generate()">Generate Challenge</button>

</div>

<!-- LOOTBOX -->
<div id="lootbox" onclick="openLootbox()">🎰 Open Lootbox</div>

<!-- COMBO -->
<div id="combo">🔥 Combo: 0</div>

<audio id="vine">
    <source src="vineboom.mp3">
</audio>

<audio id="bgm" loop>
    <source src="bgm.mp3">
</audio>

<script>

/* MUSIC */
const bgm=document.getElementById("bgm");
function toggleMusic(){
    bgm.paused ? bgm.play() : bgm.pause();
}

/* PARTICLES */
for(let i=0;i<40;i++){
    let p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=(Math.random()*10+5)+"s";
    document.body.appendChild(p);
}

/* COMBO SYSTEM */
let combo=0;

/* CATEGORIES */
let currentCat="all";

function setCat(c){
    currentCat=c;
}

/* CHALLENGES */
const challenges=[
{t:"Do 10 pushups",r:"common",c:"physical"},
{t:"Dance for 20 sec",r:"common",c:"fun"},
{t:"Act like chicken",r:"common",c:"fun"},

{t:"Do 50 squats",r:"rare",c:"physical"},
{t:"Talk to a stranger",r:"rare",c:"social"},

{t:"Sing in public",r:"epic",c:"social"},

{t:"Scream I AM LEGEND",r:"legendary",c:"fun"}
];

/* GENERATE */
function generate(){

let pool=challenges;

if(currentCat!=="all"){
    pool=challenges.filter(x=>x.c===currentCat);
}

let ch=pool[Math.floor(Math.random()*pool.length)];

document.getElementById("challenge").innerText=ch.t;
document.getElementById("difficulty").innerText=ch.r.toUpperCase();
document.getElementById("difficulty").className=ch.r;

/* BACKGROUND */
if(ch.r==="rare")
document.body.style.background="linear-gradient(135deg,#0033ff,#00c3ff)";
else if(ch.r==="epic")
document.body.style.background="linear-gradient(135deg,#6a00ff,#ff00d4)";
else if(ch.r==="legendary")
document.body.style.background="linear-gradient(135deg,#ffb700,#ff2a2a)";
else
document.body.style.background="linear-gradient(135deg,#6a11cb,#2575fc)";

/* EFFECTS */
if(ch.r!=="common"){
document.getElementById("vine").play();
document.body.classList.add("shake");
setTimeout(()=>document.body.classList.remove("shake"),400);
}

/* COMBO */
combo++;
document.getElementById("combo").innerText="🔥 Combo: "+combo;
}

/* LOOTBOX SYSTEM */
function openLootbox(){

let spin=0;
let interval=setInterval(()=>{

document.getElementById("challenge").innerText=
challenges[Math.floor(Math.random()*challenges.length)].t;

spin++;

if(spin>10){
clearInterval(interval);
generate();
}

},100);
}

</script>

</body>
</html>
