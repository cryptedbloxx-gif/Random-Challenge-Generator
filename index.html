<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lootbox Challenge Game</title>

<style>

/* BACKGROUND */
body{
    margin:0;
    font-family:Arial;
    overflow:hidden;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    color:white;
}

/* PARTICLES */
.particle{
    position:fixed;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:0.4;
    animation:float linear infinite;
    z-index:0;
}

@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-10vh);}
}

/* OWNER */
#owner{
    position:fixed;
    top:10px;
    right:15px;
    font-weight:bold;
    z-index:5;
}

/* MUSIC BUTTON */
#musicBtn{
    position:fixed;
    top:10px;
    left:15px;
    padding:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
    z-index:5;
}
#musicBtn:hover{
    transform:scale(1.3);
}

/* LOOTBOX (FIXED POSITION) */
#lootbox{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    font-size:80px;
    cursor:pointer;
    transition:0.2s;
    z-index:5;
}

#lootbox:hover{
    transform:translateX(-50%) scale(1.15);
}

/* BREAK ANIMATION */
.break{
    animation:break 0.6s forwards;
}

@keyframes break{
    0%{transform:translateX(-50%) rotate(0deg) scale(1);}
    40%{transform:translateX(-50%) rotate(20deg) scale(1.3);}
    100%{transform:translateX(-50%) rotate(-80deg) scale(0);}
}

/* CHALLENGE DISPLAY (VISIBLE FIX) */
#challenge{
    position:fixed;
    bottom:120px;
    left:50%;
    transform:translateX(-50%);
    font-size:26px;
    text-align:center;
    width:80%;
    z-index:5;
}

/* SHAKE */
.shake{animation:shake 0.4s;}

@keyframes shake{
    0%{transform:translate(0);}
    20%{transform:translate(-10px);}
    40%{transform:translate(10px);}
    60%{transform:translate(-10px);}
    80%{transform:translate(10px);}
    100%{transform:translate(0);}
}

</style>
</head>

<body>

<div id="owner">👑 OWNER : TEJPREET</div>

<button id="musicBtn" onclick="toggleMusic()">🎵 Music</button>

<div id="challenge">Click lootbox to start</div>

<div id="lootbox">🎰</div>

<audio id="bgm" loop>
<source src="bgm.mp3">
</audio>

<audio id="vine">
<source src="vineboom.mp3">
</audio>

<audio id="thrash">
<source src="Thrash.mp3">
</audio>

<script>

/* MUSIC */
const bgm=document.getElementById("bgm");
function toggleMusic(){
bgm.paused ? bgm.play() : bgm.pause();
}

/* PARTICLES */
for(let i=0;i<50;i++){
let p=document.createElement("div");
p.className="particle";
p.style.left=Math.random()*100+"vw";
p.style.animationDuration=(Math.random()*8+5)+"s";
document.body.appendChild(p);
}

/* 100 CHALLENGES */
const challenges=[
"Do 10 pushups","Do 20 squats","Run in place","Dance randomly","Act like chicken",
"Sing loudly","Spin 10 times","Jump 20 times","Plank 30s","Burpees 5x",
"Walk backwards","Robot voice","Clap 50 times","Freeze 30s","Sit stand 20x",
"Touch toes","Balance one foot","Lunges 10x","Funny face","Alphabet backwards",
"Shadow boxing","Jumping jacks","Monkey act","Zombie walk","Air guitar",
"Cartwheel try","Slow dance","Act scared","Silent scream","Fast spin"
];

/* LOOTBOX SYSTEM */
const box=document.getElementById("lootbox");
const text=document.getElementById("challenge");

let clickCount=0;

box.addEventListener("click",()=>{

clickCount++;

/* NORMAL CLICK FEEDBACK */
if(clickCount<3){
box.style.transform="translateX(-50%) scale(1.2)";
setTimeout(()=>{
box.style.transform="translateX(-50%) scale(1)";
},150);
return;
}

/* 3 CLICK TRIGGER */
clickCount=0;

document.getElementById("thrash").play();

/* BREAK ANIMATION */
box.classList.add("break");

setTimeout(()=>{

box.classList.remove("break");

/* FINAL REWARD */
let c=challenges[Math.floor(Math.random()*challenges.length)];

text.innerText=c;

/* EFFECT */
document.getElementById("vine").play();
document.body.classList.add("shake");

setTimeout(()=>{
document.body.classList.remove("shake");
},400);

},600);

});

/* START MUSIC ON CLICK */
document.addEventListener("click",()=>{
bgm.play();
},{once:true});

</script>

</body>
</html>
